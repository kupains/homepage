name: Sync Google Sheet content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-sheet-content]

permissions:
  contents: write

concurrency:
  group: sync-sheet-content
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install image optimizer
        run: npm ci

      - name: Generate site content from Google Sheets
        env:
          PAINS_SHEET_ID: 1-kCJGJfKqNTW1D09GdNoL6eyZXUDJO_Ef_EBY0grJNo
        run: node tools/sheets-to-content.mjs

      - name: Show generated content summary
        run: |
          node -e "const c=require('./data/site-content.json'); console.log({updatedAt:c.meta?.updatedAt, schedule:c.home?.schedule?.length, projects:c.projects?.length, notices:c.notices?.length, members:c.organization?.members?.length})"

      - name: Commit generated content
        run: |
          if git diff --quiet -- data/site-content.json index.html images/cms; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-content.json index.html
          if [ -d images/cms ]; then
            git add images/cms
          fi
          git commit -m "Sync site content from Google Sheets"
          git push

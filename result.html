<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINS - 11기 최종 합격자 안내</title>
    <style>
        /* ============================ */
        /* [1] 폰트 및 기본 스타일        */
        /* ============================ */

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'SCDream', sans-serif; line-height: 1.6; }

        /* ============================ */
        /* [2] 메인 컨텐츠 세부 스타일    */
        /* ============================ */
        .container { max-width: 700px; margin: 0 auto; padding: 0 1rem; text-align: center; }

        .search-card {
            background: white; border-radius: 12px; padding: 2.5rem 2rem;
            margin-bottom: 2rem;
            /* 테두리와 그림자는 menu.js에서 동적 주입 (.search-card 대신 기본 속성에 맞게) */
        }
        .search-card h2 { font-family: 'KBO_Dia', sans-serif; color: #ab3333; margin-bottom: 0.5rem; font-size: 1.6rem; }
        .sub-title { color: #666; font-size: 0.9rem; margin-bottom: 30px; }

        .round-selector {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
            margin: 24px 0 18px; padding: 5px; border-radius: 14px; background: #f1f3f6;
        }
        .round-selector button {
            min-height: 46px; border: 0; border-radius: 10px; background: transparent;
            color: #697386; font-size: 0.95rem; font-weight: 700; cursor: pointer;
        }
        .round-selector button.is-active { background: #ab3333; color: #fff; box-shadow: 0 6px 16px rgba(171,51,51,.2); }
        .round-selector button.is-closed:not(.is-active)::after { content: ' · 닫힘'; font-size: .72rem; opacity: .72; }

        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; color: #555; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px; font-size: 1rem; font-family: 'SCDream', sans-serif; outline: none;
            /* 테두리 등은 menu.js가 덮어씌움 */
        }

        .btn-submit {
            width: 100%; padding: 12px; background-color: #ab3333; color: white; border: none; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { background-color: #8f2a2a; }

        #result-area { margin-top: 30px; display: none; padding-top: 30px; border-top: 2px dashed #eee; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .result-msg { font-size: 1.1rem; margin-bottom: 15px; }
        .status-badge {
            display: inline-block; padding: 8px 20px; border-radius: 30px;
            font-size: 1.5rem; font-weight: bold; color: white; margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .status-pass { background-color: #27ae60; }
        .status-fail { background-color: #e74c3c; }

        .interview-box {
            background-color: #f8f9fa; border-radius: 10px; padding: 20px;
            text-align: left; border-left: 5px solid #ab3333; margin-top: 20px;
            display: none;
        }
        .interview-box h4 { margin-bottom: 10px; color: #333; font-weight: bold; }
        .interview-info li { list-style: none; margin-bottom: 5px; color: #555; }
        .interview-info strong { color: #333; margin-right: 5px; display: inline-block; width: 45px; }

        .map-image {
            width: 100%; height: auto; margin-top: 15px; border-radius: 8px; border: 1px solid #ddd; display: none;
        }

        .warning-msg { font-size: 0.85rem; color: #e74c3c; margin-top: 15px; font-weight: bold; word-break: keep-all; }
        .notice-msg { font-size: 0.8rem; color: #888; margin-top: 8px; word-break: keep-all; }

        .loader { display: none; margin: 20px auto; border: 4px solid #f3f3f3; border-top: 4px solid #ab3333; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <script src="js/content-boot.js?v=20260807-no-flash"></script>
    <script defer src="js/content-loader.js?v=20260803-rounds1"></script>
</head>
<body>

    <header></header>
    <div class="sidebar" id="sidebar"></div>
    <div class="overlay" id="overlay"></div>

    <div class="container">
        <div class="search-card">
            <h2>11기 최종 합격자 안내</h2>
            <div class="round-selector" role="tablist" aria-label="결과 조회 차수 선택">
                <button type="button" id="round-1-button" role="tab" aria-selected="true" onclick="setResultRound(1)">1차 결과</button>
                <button type="button" id="round-2-button" role="tab" aria-selected="false" onclick="setResultRound(2)">2차 결과</button>
            </div>
            <p class="sub-title">지원 시 제출한 학번과 이름을 입력해주세요.</p>

            <div class="input-group">
                <label for="input-id">학번 (ID)</label>
                <input type="text" id="input-id" placeholder="예: 2026123456">
            </div>
            <div class="input-group">
                <label for="input-name">이름 (Name)</label>
                <input type="text" id="input-name" placeholder="예: 홍길동">
            </div>

            <button class="btn-submit" onclick="checkResult()" id="btn-search">결과 확인하기</button>
            <div class="loader" id="loader"></div>

            <div id="result-area">
                <p class="result-msg"><span id="user-name-display" style="font-weight:bold;"></span>님의 결과입니다.</p>

                <div id="status-badge" class="status-badge">결과 로딩중</div>

                <p id="result-desc" style="color: #666; font-size: 0.95rem; word-break: keep-all; text-align: left; line-height: 1.7; padding: 10px 5px;">
                </p>

                <div class="interview-box" id="interview-box">
                    <h4>OT 일정 안내</h4>
                    <ul class="interview-info">
                        <li><strong>일자:</strong> <span id="display-date"></span></li>
                        <li><strong>시간:</strong> <span id="display-time"></span></li>
                        <li><strong>장소:</strong> <span id="display-location"></span></li>
                    </ul>

                    <img id="display-map" class="map-image" src="" alt="면접장소 약도">

                    <p class="warning-msg">* OT는 3월 16일 월요일 오후 7시 상남정경관 101호에서 진행될 예정입니다.</p>
                    <p class="notice-msg">* 합격자는 OT 시작 전 채팅방에 초대되어 OT에 대한 안내가 진행될 예정입니다.</p>
                    <p class="notice-msg">* 정당한 사유 없이 OT에 불참할 경우 합격이 취소될 수 있으니 유의바랍니다.</p>
                </div>
            </div>

        </div>
    </div>

    <footer></footer>

    <script>
        document.write('<script src="menu.js?v=20260803-mobile2"><\/script>');
    </script>

    <script>
        loadSidebar('result');

        const RESULT_API_TOKEN = 'PAINS_2026_CUSTOM_KEY';
        let selectedResultRound = 1;
        let resultRoundInitialized = false;
        let latestResultConfig = null;

        function firstFilled(...values) {
            return values.find((value) => value !== undefined && value !== null && String(value).trim() !== '');
        }

        function setResultMultilineText(node, value) {
            if (!node || value === undefined || value === null) return;
            node.textContent = String(value).replace(/<br\s*\/?>/gi, '\n');
            node.style.whiteSpace = 'pre-line';
        }

        async function getResultConfig() {
            const content = await window.PainsContent?.load?.();
            const config = {
                content: content || window.__painsContentLatest || {},
                settings: content?.settings || window.__painsContentLatest?.settings || {},
                page: content?.resultPage || window.__painsContentLatest?.resultPage || {}
            };
            applyResultRoundConfig(config.content);
            return config;
        }

        function resultText(page, key, fallback) {
            return firstFilled(page[key], fallback);
        }

        function roundText(page, round, key, fallback) {
            const roundKey = `round${round}${key.charAt(0).toUpperCase()}${key.slice(1)}`;
            return firstFilled(page[roundKey], page[key], fallback);
        }

        function hasRoundSettings(settings) {
            return [1, 2].some((round) => [
                `result${round}Enabled`, `result${round}Open`, `result${round}Visible`,
                `result${round}StartAt`, `result${round}EndAt`
            ].some((key) => Object.prototype.hasOwnProperty.call(settings || {}, key)));
        }

        function isResultRoundOpen(content, round) {
            if (!window.PainsContent?.featureGate) return true;
            const settings = content?.settings || {};
            return hasRoundSettings(settings)
                ? window.PainsContent.featureGate(content, `result${round}`, false)
                : window.PainsContent.featureGate(content, 'result', false);
        }

        function roundClosedMessage(settings, page, round) {
            return firstFilled(
                page[`round${round}ClosedMessage`],
                settings[`result${round}ClosedMessage`],
                page.closedMessage,
                settings.resultClosedMessage,
                `${round}차 결과 조회 기간이 아닙니다.`
            );
        }

        function setResultRound(round) {
            const nextRound = Number(round) === 2 ? 2 : 1;
            const resolved = latestResultConfig || window.__painsContentLatest || {};
            if (!isResultRoundOpen(resolved, nextRound)) return;
            selectedResultRound = nextRound;
            resultRoundInitialized = true;
            if (latestResultConfig) applyResultRoundConfig(latestResultConfig);
        }

        function applyResultRoundConfig(content) {
            const resolved = content || window.__painsContentLatest || {};
            const settings = resolved.settings || {};
            const page = resolved.resultPage || {};
            latestResultConfig = resolved;

            const open = {
                1: isResultRoundOpen(resolved, 1),
                2: isResultRoundOpen(resolved, 2)
            };
            const visibleRounds = [1, 2].filter((round) => open[round]);
            if (!resultRoundInitialized || !open[selectedResultRound]) {
                selectedResultRound = visibleRounds[0] || 1;
                resultRoundInitialized = true;
            }

            const selector = document.querySelector('.round-selector');
            if (selector) {
                selector.hidden = visibleRounds.length === 0;
                selector.style.gridTemplateColumns = `repeat(${Math.max(visibleRounds.length, 1)}, minmax(0, 1fr))`;
            }

            [1, 2].forEach((round) => {
                const button = document.getElementById(`round-${round}-button`);
                if (!button) return;
                const active = selectedResultRound === round;
                button.hidden = !open[round];
                button.textContent = roundText(page, round, 'label', `${round}차 결과`);
                button.classList.toggle('is-active', active);
                button.classList.remove('is-closed');
                button.setAttribute('aria-selected', String(active));
                button.setAttribute('aria-label', button.textContent);
            });

            const round = selectedResultRound;
            const roundOpen = open[round];
            const title = roundText(page, round, 'title', `${round}차 결과 안내`);
            const subtitle = roundOpen
                ? roundText(page, round, 'subtitle', page.subtitle || '')
                : roundClosedMessage(settings, page, round);
            const pageTitle = roundText(page, round, 'pageTitle', page.pageTitle || title);

            if (pageTitle) document.title = pageTitle;
            const heading = document.querySelector('.search-card h2');
            if (heading && title) heading.textContent = title;
            const subtitleNode = document.querySelector('.search-card .sub-title');
            setResultMultilineText(subtitleNode, subtitle);

            const resultArea = document.getElementById('result-area');
            if (resultArea) resultArea.style.display = 'none';

            const button = document.getElementById('btn-search');
            if (button) {
                button.disabled = false;
                button.textContent = roundOpen
                    ? roundText(page, round, 'buttonLabel', page.buttonLabel || '결과 확인하기')
                    : roundText(page, round, 'closedButtonLabel', page.closedButtonLabel || '조회 기간이 아닙니다');
                button.onclick = roundOpen ? checkResult : (event) => {
                    event.preventDefault();
                    alert(roundClosedMessage(settings, page, round));
                    return false;
                };
            }

            const scheduleTitle = document.querySelector('.interview-box h4');
            if (scheduleTitle) scheduleTitle.textContent = roundText(page, round, 'scheduleTitle', page.otTitle || '일정 안내');
            const warning = document.querySelector('.warning-msg');
            setResultMultilineText(warning, roundText(page, round, 'warningMessage', page.warningMessage || ''));
            const notices = document.querySelectorAll('.notice-msg');
            setResultMultilineText(notices[0], roundText(page, round, 'noticeMessage1', page.noticeMessage1 || ''));
            setResultMultilineText(notices[1], roundText(page, round, 'noticeMessage2', page.noticeMessage2 || ''));
        }

        window.applyResultRoundConfig = applyResultRoundConfig;

        function fillTemplate(value, vars) {
            if (window.PainsContent?.template) return window.PainsContent.template(value, vars);
            return String(value || '').replace(/\{(\w+)\}/g, (_, key) => vars[key] ?? '');
        }

        async function checkResult() {
            const { content, settings, page } = await getResultConfig();
            const round = selectedResultRound;
            const resultOpen = isResultRoundOpen(content, round);
            const closedMessage = roundClosedMessage(settings, page, round);

            if (!resultOpen) {
                alert(closedMessage);
                return;
            }

            document.getElementById('input-id').blur();
            document.getElementById('input-name').blur();
            await new Promise(r => setTimeout(r, 200));

            const id = document.getElementById('input-id').value.trim();
            const name = document.getElementById('input-name').value.trim();

            if (!id || !name) {
                alert(roundText(page, round, 'missingInputMessage', resultText(page, 'missingInputMessage', '')));
                return;
            }

            const resultApiUrl = firstFilled(settings.resultApiUrl, page.apiUrl);
            if (!resultApiUrl) {
                alert(resultText(page, 'missingApiMessage', ''));
                return;
            }

            const btn = document.getElementById('btn-search');
            const loader = document.getElementById('loader');
            const resultArea = document.getElementById('result-area');

            btn.disabled = true;
            btn.innerText = roundText(page, round, 'loadingLabel', resultText(page, 'loadingLabel', btn.innerText));
            loader.style.display = "block";
            resultArea.style.display = "none";

            try {
                const timestamp = new Date().getTime();
                const query = new URLSearchParams({
                    id,
                    name,
                    round: String(round),
                    token: RESULT_API_TOKEN,
                    t: String(timestamp)
                });
                const separator = resultApiUrl.includes('?') ? '&' : '?';
                const targetUrl = `${resultApiUrl}${separator}${query.toString()}`;

                const response = await fetch(targetUrl, {
                    cache: 'no-store'
                });
                if (!response.ok) {
                    throw new Error(`Result API request failed: ${response.status}`);
                }
                const data = await response.json();

                if (data.result === "error") {
                    alert(firstFilled(data.message, resultText(page, 'errorMessage', '')));
                    return;
                }

                if (data.result === "fail") {
                    alert(roundText(page, round, 'notFoundMessage', resultText(page, 'notFoundMessage', '')));
                    return;
                }

                if (data.result === "locked") {
                    alert(fillTemplate(
                        resultText(page, 'lockedMessageTemplate', ''),
                        data
                    ));
                    return;
                }

                if (data.result !== "success" || !["합격", "불합격"].includes(data.status)) {
                    alert(resultText(page, 'errorMessage', ''));
                    return;
                }

                document.getElementById('user-name-display').innerText = name;
                const badge = document.getElementById('status-badge');
                const desc = document.getElementById('result-desc');
                const interviewBox = document.getElementById('interview-box');
                const mapImage = document.getElementById('display-map');
                const defaultValue = roundText(page, round, 'defaultValue', resultText(page, 'defaultValue', ''));
                const messageTemplate = roundText(page, round, 'resultMessageTemplate', resultText(page, 'resultMessageTemplate', '{name}'));
                const resultMsg = document.querySelector('.result-msg');
                if (resultMsg) {
                    resultMsg.innerHTML = fillTemplate(messageTemplate, {
                        name: `<span id="user-name-display" style="font-weight:bold;">${name}</span>`
                    });
                }

                if (data.status === "합격") {
                    badge.innerText = roundText(page, round, 'passStatusLabel', resultText(page, 'passStatusLabel', ''));
                    badge.className = "status-badge status-pass";
                    setResultMultilineText(desc, roundText(page, round, 'passDescription', resultText(page, 'passDescription', '')));

                    const loc = data.interviewLocation || defaultValue;
                    document.getElementById('display-date').innerText = data.interviewDate || defaultValue;
                    document.getElementById('display-time').innerText = data.interviewTime || defaultValue;
                    document.getElementById('display-location').innerText = loc;

                    const mapUrl = firstFilled(data.mapUrl, page[`round${round}MapImage`], page.mapImage);
                    if (mapUrl) {
                        mapImage.src = window.PainsContent?.assetUrl ? window.PainsContent.assetUrl(mapUrl) : mapUrl;
                        mapImage.style.display = 'block';
                    }

                    interviewBox.style.display = "block";

                } else if (data.status === "불합격") {
                    badge.innerText = roundText(page, round, 'failStatusLabel', resultText(page, 'failStatusLabel', ''));
                    badge.className = "status-badge status-fail";

                    setResultMultilineText(desc, roundText(page, round, 'failDescription', resultText(page, 'failDescription', '')));

                    interviewBox.style.display = "none";
                    mapImage.style.display = 'none';
                }

                resultArea.style.display = "block";

            } catch (error) {
                console.error("에러 발생:", error);
                alert(resultText(page, 'errorMessage', ''));
            } finally {
                btn.disabled = false;
                btn.innerText = roundText(page, round, 'buttonLabel', resultText(page, 'buttonLabel', btn.innerText));
                loader.style.display = "none";
            }
        }
    </script>
</body>
</html>
